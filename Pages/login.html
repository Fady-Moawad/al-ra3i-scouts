<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | الراعي الكشفي</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Login CSS -->
    <link rel="stylesheet" href="../CSS/login.css">

</head>

<body dir="rtl">

    <main class="login-page min-vh-100 d-flex align-items-center justify-content-center">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-12 col-sm-10 col-md-7 col-lg-5">

                    <div class="login-card bg-white shadow p-4 p-md-5">

                        <div class="text-center mb-4">

                            <div class="login-icon mx-auto mb-3">
                                <i class="fa-solid fa-user"></i>
                            </div>

                            <h2 class="fw-bold mb-2">
                                تسجيل الدخول
                            </h2>

                            <p class="text-muted mb-0">
                                مرحبًا بك في نظام الحضور
                            </p>

                        </div>


                        <form id="loginForm">

                            <div class="mb-3">

                                <label for="email" class="form-label fw-semibold">
                                    البريد الإلكتروني
                                </label>

                                <input
                                    type="email"
                                    class="form-control form-control-lg"
                                    id="email"
                                    placeholder="أدخل البريد الإلكتروني"
                                    required
                                >

                            </div>


                            <div class="mb-4">

                                <label for="password" class="form-label fw-semibold">
                                    كلمة المرور
                                </label>

                                <div class="input-group">

                                    <input
                                        type="password"
                                        class="form-control form-control-lg"
                                        id="password"
                                        placeholder="أدخل كلمة المرور"
                                        required
                                    >

                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary"
                                        id="togglePassword"
                                    >
                                        <i class="fa-solid fa-eye"></i>
                                    </button>

                                </div>

                            </div>


                            <button
                                type="submit"
                                class="btn btn-main btn-lg w-100"
                            >
                                تسجيل الدخول
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- jQuery -->

    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>

    <script src="../JS/login.js"></script>

</body>
</html>
