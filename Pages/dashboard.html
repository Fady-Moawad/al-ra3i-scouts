<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة التحكم - كشافة الراعي</title>


    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>


<body class="bg-light">


    <!-- =========================
            NAVBAR
    ========================= -->

    <nav class="navbar bg-white shadow-sm">

        <div class="container">

            <span class="navbar-brand fw-bold">

                <i class="bi bi-speedometer2 me-2"></i>

                كشافة الراعي

            </span>


            <span class="text-secondary">

                لوحة التحكم

            </span>

        </div>

    </nav>



    <!-- =========================
            DASHBOARD
    ========================= -->

    <main class="container py-5">


        <!-- Header -->

        <div class="mb-4">

            <h1 class="fw-bold mb-2">

                لوحة التحكم

            </h1>

            <p class="text-secondary mb-0">

                نظرة سريعة على إحصائيات الحضور

            </p>

        </div>



        <!-- =========================
                    STATISTICS
        ========================= -->

        <div class="row g-4 mb-5">

            <!-- Total Users -->
            <div class="col-12 col-sm-6 col-xl">
                <div class="card border-0 shadow-sm rounded-4 h-100">

                    <div class="card-body p-4">

                        <div class="d-flex justify-content-between align-items-center">

                            <div>

                                <p class="text-secondary mb-2">
                                    إجمالي الأفراد
                                </p>

                                <h2 id="totalUsers" class="fw-bold mb-0">
                                    0
                                </h2>

                            </div>

                            <div class="bg-primary bg-opacity-10 text-primary rounded-circle p-3">

                                <i class="bi bi-people fs-4"></i>

                            </div>

                        </div>

                    </div>

                </div>
            </div>


            <!-- Total Team -->
            <div class="col-12 col-sm-6 col-xl">

                <div class="card border-0 shadow-sm rounded-4 h-100">

                    <div class="card-body p-4">

                        <div class="d-flex justify-content-between align-items-center mb-3">

                            <div>

                                <p class="text-secondary mb-2">
                                    إجمالي عدد الفريق
                                </p>

                                <h2 id="totalTeam" class="fw-bold mb-0">
                                    0
                                </h2>

                            </div>

                            <div class="bg-info bg-opacity-10 text-info rounded-circle p-3">

                                <i class="bi bi-person-badge fs-4"></i>

                            </div>

                        </div>


                        <!-- Team Select -->

                        <select id="teamSelect" class="form-select form-select-sm">

                            <option value="all">
                                كل الفرق
                            </option>

                            <option value="team1">
                                الفريق الأول
                            </option>

                            <option value="team2">
                                الفريق الثاني
                            </option>

                            <option value="team3">
                                الفريق الثالث
                            </option>

                        </select>

                    </div>

                </div>

            </div>


            <!-- Today Attendance -->
            <div class="col-12 col-sm-6 col-xl">

                <div class="card border-0 shadow-sm rounded-4 h-100">

                    <div class="card-body p-4">

                        <div class="d-flex justify-content-between align-items-center">

                            <div>

                                <p class="text-secondary mb-2">
                                    حضور اليوم
                                </p>

                                <h2 id="todayAttendance" class="fw-bold mb-0">
                                    0
                                </h2>

                            </div>

                            <div class="bg-success bg-opacity-10 text-success rounded-circle p-3">

                                <i class="bi bi-person-check fs-4"></i>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Absent -->
            <div class="col-12 col-sm-6 col-xl">

                <div class="card border-0 shadow-sm rounded-4 h-100">

                    <div class="card-body p-4">

                        <div class="d-flex justify-content-between align-items-center">

                            <div>

                                <p class="text-secondary mb-2">
                                    غياب اليوم
                                </p>

                                <h2 id="todayAbsent" class="fw-bold mb-0">
                                    0
                                </h2>

                            </div>

                            <div class="bg-danger bg-opacity-10 text-danger rounded-circle p-3">

                                <i class="bi bi-person-x fs-4"></i>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Attendance Percentage -->
            <div class="col-12 col-sm-6 col-xl">

                <div class="card border-0 shadow-sm rounded-4 h-100">

                    <div class="card-body p-4">

                        <div class="d-flex justify-content-between align-items-center">

                            <div>

                                <p class="text-secondary mb-2">
                                    نسبة الحضور
                                </p>

                                <h2 id="attendancePercentage" class="fw-bold mb-0">
                                    0%
                                </h2>

                            </div>

                            <div class="bg-warning bg-opacity-10 text-warning rounded-circle p-3">

                                <i class="bi bi-bar-chart fs-4"></i>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>




        <!-- =========================
                CHART
        ========================= -->

        <div class="card border-0 shadow-sm rounded-4">

            <div class="card-body p-4 p-md-5">

                <div class="mb-4">

                    <h4 class="fw-bold mb-2">

                        الحضور اليوم

                    </h4>

                    <p class="text-secondary mb-0">

                        إحصائية بسيطة لمتابعة الحضور

                    </p>

                </div>


                <div style="height: 350px;">

                    <canvas id="attendanceChart"></canvas>

                </div>

            </div>

        </div>


    </main>



    <!-- =========================
            JQUERY
    ========================= -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>


    <!-- =========================
            BOOTSTRAP JS
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- =========================
            CHART JS
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js">
    </script>


    <!-- =========================
            DASHBOARD JS
    ========================= -->

    <script src="../JS/dashboard.js"></script>

</body>

</html>
