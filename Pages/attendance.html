
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تسجيل الحضور - كشافة الراعي</title>


    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Bootstrap RTL -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="../CSS/attendance.css"
    >

</head>


<body>


    <!-- Navbar -->

    <div id="navbar"></div>


    <!-- =========================
            ATTENDANCE PAGE
    ========================= -->

    <main class="attendance-page">

        <div class="container py-5">

            <div class="row justify-content-center">

                <div class="col-12 col-md-9 col-lg-7 col-xl-6">


                    <!-- =========================
                            PAGE HEADER
                    ========================= -->

                    <div class="attendance-page-header text-center">

                        <div class="attendance-page-icon">

                            <i class="bi bi-person-check"></i>

                        </div>


                        <span class="section-label">
                            كشافة الراعي
                        </span>


                        <h1 class="attendance-title mt-2 mb-2">
                            تسجيل الحضور
                        </h1>


                        <p class="attendance-subtitle mb-0">
                            تأكد من بياناتك ثم قم بتسجيل حضورك
                        </p>

                    </div>


                    <!-- =========================
                            ATTENDANCE CARD
                    ========================= -->

                    <div
                        id="userCard"
                        class="attendance-card"
                    >

                        <div class="attendance-card-content">

                           <div class="text-center">

    <div class="mb-4">
        <img
            id="userAvatar"
            src="../assets/images/user.jpg"
            alt="صورة المستخدم"
            class="attendance-avatar"
        >
    </div>

    <h3
        id="userName"
        class="attendance-name mb-2"
    >
        اسم المستخدم
    </h3>

    <div
        id="userPhase"
        class="attendance-stage mb-4"
    >
        <i class="bi bi-mortarboard"></i>
        المرحلة
    </div>

    <hr class="attendance-divider">

    <div class="d-grid gap-3">

        <button
            type="button"
            class="btn attendance-btn-main btn-lg"
            id="attendanceBtn"
        >
            <i class="bi bi-check-circle me-2"></i>
            تسجيل الحضور
        </button>

    </div>

</div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- jQuery -->

    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>


    <!-- Attendance JS -->

    <script src="../JS/attendance.js"></script>

</body>

</html>
