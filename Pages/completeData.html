<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>كشافة الراعي</title>

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Bootstrap RTL -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

</head>

<body class="bg-light">

    <!-- =========================
            PAGE
    ========================= -->

    <main class="min-vh-100 d-flex align-items-center py-5">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

                    <!-- =========================
                            CARD
                    ========================= -->

                    <div class="card border-0 shadow-lg rounded-4">

                        <div class="card-body p-4 p-md-5">

                            <!-- =========================
                                    FORM HEADER
                            ========================= -->

                            <div class="text-center mb-4">

                                <div
                                    class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                                    style="width: 70px; height: 70px;"
                                >

                                    <i
                                        class="bi bi-person-plus fs-2"
                                    ></i>

                                </div>

                                <h3 class="fw-bold mb-2">

                                    أكمل بياناتك

                                </h3>

                                <p class="text-secondary mb-0">

                                    من فضلك قم بتسجيل اسمك والمرحلة أولًا

                                </p>

                            </div>


                            <!-- =========================
                                    FORM
                            ========================= -->

                            <form id="profileForm">

                                <!-- Name -->

                                <div class="mb-4">

                                    <label
                                        for="name"
                                        class="form-label fw-semibold"
                                    >

                                        الاسم

                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text bg-white">

                                            <i class="bi bi-person"></i>

                                        </span>

                                        <input
                                            type="text"
                                            class="form-control"
                                            id="name"
                                            placeholder="اكتب اسمك"
                                            autocomplete="name"
                                            required
                                        >

                                    </div>

                                </div>


                                <!-- Stage -->

                                <div class="mb-4">

                                    <label
                                        for="stage"
                                        class="form-label fw-semibold"
                                    >

                                        المرحلة

                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text bg-white">

                                            <i class="bi bi-mortarboard"></i>

                                        </span>

                                        <select
                                            class="form-select"
                                            id="stage"
                                            required
                                        >

                                            <option
                                                value=""
                                                selected
                                                disabled
                                            >

                                                اختر المرحلة

                                            </option>

                                            <option value="ابتدائي">
                                                ابتدائي
                                            </option>

                                            <option value="إعدادي">
                                                إعدادي
                                            </option>

                                            <option value="ثانوي">
                                                ثانوي
                                            </option>

                                            <option value="جامعي">
                                                جامعي
                                            </option>

                                            <option value="خريج">
                                                خريج
                                            </option>

                                        </select>

                                    </div>

                                </div>


                                <!-- Submit -->

                                <div class="d-grid">

                                    <button
                                        type="submit"
                                        class="btn btn-primary btn-lg rounded-3 fw-semibold"
                                    >

                                        <i class="bi bi-check-lg me-2"></i>

                                        حفظ البيانات

                                    </button>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- jQuery -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Page JS -->

    <script src="../JS/completeData.js"></script>

</body>

</html>
